<style>
#ck-sp{
  --ink:#1D1D1F;--body:#56565C;--muted:#9A9AA0;
  --paper:#F3F4F7;--line:rgba(60,60,67,.13);--line-2:rgba(60,60,67,.08);
  --blue:#0071E3;--blue-press:#0077ED;--blue-tint:#EAF2FE;--blue-tint-2:#F3F8FE;
  --shadow-sm:0 4px 16px -8px rgba(20,25,40,.14);
  --shadow:0 24px 56px -34px rgba(20,25,40,.24);
  --shadow-lg:0 50px 104px -50px rgba(8,30,80,.28);
  --r:16px;--r-lg:22px;--r-xl:28px;
  --pad:clamp(20px,5vw,72px);--sec-y:clamp(56px,7vw,104px);
  --ease:cubic-bezier(.22,.7,.25,1);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;
  color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  line-height:1.5;
}
#ck-sp *{margin:0;padding:0;box-sizing:border-box}
#ck-sp .wrap{max-width:1180px;margin:0 auto;padding:0 var(--pad)}
#ck-sp .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--blue)}
#ck-sp .eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 3px rgba(0,113,227,.14)}
#ck-sp .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:15px 30px;border-radius:980px;font-size:16px;font-weight:600;text-decoration:none;transition:transform .25s var(--ease),box-shadow .25s var(--ease),background .2s}
#ck-sp .btn-blue{background:var(--blue);color:#fff;box-shadow:0 12px 30px -12px rgba(0,113,227,.55)}
#ck-sp .btn-blue:hover{background:var(--blue-press);transform:translateY(-2px)}
#ck-sp .btn-ghost{color:var(--ink);font-weight:600}
#ck-sp .btn-ghost svg{width:15px;height:15px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
#ck-sp .btn-ghost:hover svg{transform:translateX(3px)}
#ck-sp .hero{padding:clamp(56px,8vw,110px) 0 clamp(40px,5vw,64px);text-align:center}
#ck-sp .hero h1{font-size:clamp(34px,5.2vw,60px);font-weight:700;letter-spacing:-.032em;line-height:1.05;margin:18px auto 18px;max-width:820px;text-wrap:balance}
#ck-sp .hero p{font-size:clamp(17px,1.5vw,20px);color:var(--body);max-width:640px;margin:0 auto 30px;text-wrap:balance}
#ck-sp .hero-cta{display:flex;gap:20px;justify-content:center;align-items:center;flex-wrap:wrap}
#ck-sp .problem{padding:clamp(30px,4vw,48px) 0}
#ck-sp .problem .card{background:var(--paper);border-radius:var(--r-xl);padding:clamp(30px,4.5vw,52px) clamp(22px,4vw,56px);display:flex;align-items:center;gap:clamp(22px,4vw,56px);flex-wrap:wrap}
#ck-sp .problem .tx{flex:1;min-width:260px}
#ck-sp .problem .tx b{display:block;font-size:clamp(19px,2vw,24px);font-weight:700;letter-spacing:-.015em;margin-bottom:6px}
#ck-sp .problem .tx span{color:var(--body);font-size:clamp(15px,1.3vw,17px)}
#ck-sp .agents{padding:var(--sec-y) 0}
#ck-sp .sec-head{text-align:center;max-width:680px;margin:0 auto clamp(34px,4.5vw,54px)}
#ck-sp .sec-head h2{font-size:clamp(27px,3.6vw,42px);font-weight:700;letter-spacing:-.028em;line-height:1.1;margin-top:14px;text-wrap:balance}
#ck-sp .ag-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;max-width:920px;margin:0 auto}
@media(max-width:900px){#ck-sp .ag-grid{grid-template-columns:1fr}}
#ck-sp .ag{background:#fff;border:1px solid var(--line-2);border-radius:var(--r-lg);padding:28px 26px;box-shadow:var(--shadow-sm);transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
#ck-sp .ag:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
#ck-sp .ag .ic{width:42px;height:42px;border-radius:12px;background:var(--blue-tint);display:flex;align-items:center;justify-content:center;margin-bottom:16px}
#ck-sp .ag .ic svg{width:21px;height:21px;stroke:var(--blue);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
#ck-sp .ag h3{font-size:18.5px;font-weight:700;letter-spacing:-.012em;margin-bottom:4px}
#ck-sp .ag .tag{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--blue);margin-bottom:12px}
#ck-sp .ag p{font-size:15px;color:var(--body);line-height:1.6}
#ck-sp .band{padding:clamp(20px,3vw,36px) 0 var(--sec-y)}
#ck-sp .band .card{background:linear-gradient(135deg,#0A5BC4,#0071E3 55%,#2E9BEF);border-radius:var(--r-xl);padding:clamp(36px,5vw,60px) clamp(24px,4vw,56px);box-shadow:var(--shadow-lg)}
#ck-sp .band-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px}
@media(max-width:900px){#ck-sp .band-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){#ck-sp .band-grid{grid-template-columns:1fr}}
#ck-sp .bs{border-left:1px solid rgba(255,255,255,.28);padding-left:22px}
#ck-sp .bs .v{font-size:clamp(21px,2.4vw,30px);font-weight:700;letter-spacing:-.02em;color:#fff}
#ck-sp .bs .k{font-size:13.5px;color:rgba(255,255,255,.78);margin-top:6px;line-height:1.45}
#ck-sp .proof{padding:0 0 var(--sec-y)}
#ck-sp .proof .card{border:1px solid rgba(0,113,227,.16);background:var(--blue-tint-2);border-radius:var(--r-xl);padding:clamp(30px,4.5vw,52px) clamp(22px,4vw,56px)}
#ck-sp .proof .q .lbl{font-size:12px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
#ck-sp .proof .q b{font-size:clamp(19px,2.2vw,27px);font-weight:700;letter-spacing:-.018em;line-height:1.3;display:block;max-width:900px}
#ck-sp .proof .q b i{font-style:normal;color:var(--blue)}
#ck-sp .proof-stats{display:flex;gap:clamp(32px,6vw,84px);flex-wrap:wrap;margin-top:clamp(22px,3vw,34px);padding-top:clamp(20px,2.5vw,28px);border-top:1px solid rgba(0,113,227,.14)}
#ck-sp .ps .v{font-size:clamp(19px,2vw,26px);font-weight:700;letter-spacing:-.015em;color:var(--blue)}
#ck-sp .ps .k{font-size:13px;color:var(--body);margin-top:3px;line-height:1.4}
#ck-sp .cms{padding:0 0 var(--sec-y)}
#ck-sp .cms .inner{max-width:760px;margin:0 auto;text-align:center}
#ck-sp .cms p{color:var(--body);font-size:clamp(15.5px,1.4vw,17.5px);line-height:1.65;margin-top:16px}
#ck-sp .faq{padding:0 0 var(--sec-y)}
#ck-sp .faq .inner{max-width:760px;margin:0 auto}
#ck-sp details{border:1px solid var(--line-2);border-radius:var(--r);background:#fff;padding:0 22px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
#ck-sp summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 0;font-size:16px;font-weight:650;letter-spacing:-.008em}
#ck-sp summary::-webkit-details-marker{display:none}
#ck-sp summary svg{width:16px;height:16px;stroke:var(--muted);stroke-width:2.2;fill:none;stroke-linecap:round;flex-shrink:0;transition:transform .25s var(--ease)}
#ck-sp details[open] summary svg{transform:rotate(45deg)}
#ck-sp details p{padding:0 0 18px;color:var(--body);font-size:15px;line-height:1.65;max-width:64ch}
#ck-sp .cta{padding:0 0 var(--sec-y)}
#ck-sp .cta .card{background:linear-gradient(135deg,#0A5BC4,#0071E3 55%,#2E9BEF);border-radius:var(--r-xl);padding:clamp(44px,6vw,76px) clamp(24px,5vw,64px);text-align:center;box-shadow:var(--shadow-lg)}
#ck-sp .cta h2{color:#fff;font-size:clamp(26px,3.4vw,40px);font-weight:700;letter-spacing:-.025em;max-width:620px;margin:0 auto 12px;text-wrap:balance}
#ck-sp .cta p{color:rgba(255,255,255,.82);font-size:16.5px;max-width:520px;margin:0 auto 28px}
#ck-sp .cta .btn-w{background:#fff;color:var(--ink);box-shadow:0 10px 30px -12px rgba(0,20,60,.45)}
#ck-sp .cta .btn-w:hover{transform:translateY(-2px)}
</style>
