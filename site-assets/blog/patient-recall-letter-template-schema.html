<script type="application/ld+json">{"@context": "https://schema.org", "@type": "FAQPage", "mainEntity": [{"@type": "Question", "name": "What is a patient recall letter?", "acceptedAnswer": {"@type": "Answer", "text": "A message, sent by mail, email, or text, that reminds a patient who is due for a follow-up visit to schedule it. It differs from an appointment reminder, which confirms a visit that's already booked."}}, {"@type": "Question", "name": "How often should I send a patient recall letter?", "acceptedAnswer": {"@type": "Answer", "text": "Send the first message when the patient becomes due, then a second attempt within two to three weeks if there's no response. The Cochrane review's pooled data found repeated contact attempts outperformed a single mailing."}}, {"@type": "Question", "name": "Should I use a letter, text, or email for patient recall?", "acceptedAnswer": {"@type": "Answer", "text": "Use more than one. The BMC Ophthalmology study found text reminders cut non-attendance by more than a third compared with no reminder at all. Letters still work for patients who prefer mail, but they shouldn't be the only channel a practice relies on."}}, {"@type": "Question", "name": "What's the difference between a recall letter and a reactivation letter?", "acceptedAnswer": {"@type": "Answer", "text": "A recall letter reaches a patient who is due for care but hasn't booked yet. A reactivation letter reaches a patient who has gone fully dormant. Reminders vs Recall vs Reactivation covers the difference in full."}}, {"@type": "Question", "name": "Do these templates work for orthopedic and oral surgery practices?", "acceptedAnswer": {"@type": "Answer", "text": "Yes, once the visit reason is changed. Replace the hygiene-interval language with the actual reason the patient is due: a post-op check, an imaging follow-up, or the next step in a treatment course."}}]}</script>
