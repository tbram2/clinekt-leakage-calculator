        {"@type": "Question", "name": "What is referral management software?", "acceptedAnswer": {"@type": "Answer", "text": "Referral management software tracks a referral from intake through a completed appointment. The category includes EHR-native modules, broader patient-engagement platforms, and purpose-built referral automation tools, and they differ mainly in whether they just log a referral or actively contact, schedule, and report on it."}},
        {"@type": "Question", "name": "Do I need referral management software if my EHR already has a referral module?", "acceptedAnswer": {"@type": "Answer", "text": "Depends on what the module actually does. Most EHR-native referral tools log the referral inside the chart but do not contact the patient, schedule the visit, or report back to the referring provider."}},
        {"@type": "Question", "name": "How do I know if my practice has a referral leakage problem?", "acceptedAnswer": {"@type": "Answer", "text": "Count referrals received last month, count completed visits from those same referrals, and divide. Most practices have never run this number."}},
        {"@type": "Question", "name": "What is the single biggest factor in whether a referral completes?", "acceptedAnswer": {"@type": "Answer", "text": "Speed of first contact. Same-day contact and same-day scheduling beat a callback attempt three days later, consistently."}},
