<script type="application/ld+json">{"@context": "https://schema.org", "@type": "FAQPage", "mainEntity": [{"@type": "Question", "name": "What message types does primary care patient communications software need to handle?", "acceptedAnswer": {"@type": "Answer", "text": "At minimum six: portal and phone message triage, annual wellness visit and chronic-disease recall, referral coordination in both directions, prescription refill routing, appointment reminders across a multi-provider panel, and after-hours message routing."}}, {"@type": "Question", "name": "How heavy is the patient-message burden in primary care?", "acceptedAnswer": {"@type": "Answer", "text": "A 2025 study of 295 primary care physicians and nearly 2.2 million in-basket messages in 2023 found family medicine physicians averaged 17 messages per hour of patient-facing clinical care, the highest of any primary care specialty studied."}}, {"@type": "Question", "name": "Is there a verified no-show rate for primary care practices?", "acceptedAnswer": {"@type": "Answer", "text": "Yes. A 2025 study of 15 family medicine clinics covering 109,328 patients and 1,118,236 appointments found a 6.9% no-show rate and a 6.8% late-cancellation rate, with scheduling lead time the strongest predictor."}}, {"@type": "Question", "name": "Why does message triage matter more in primary care than in a single-specialty practice?", "acceptedAnswer": {"@type": "Answer", "text": "Because one panel spans everything from a same-day symptom report to a routine refill request, and message volume is already heavy enough that treating every message the same way means the urgent one waits behind the routine ones."}}, {"@type": "Question", "name": "Does Clinekt make clinical decisions?", "acceptedAnswer": {"@type": "Answer", "text": "No. Clinekt notifies and reaches the patient or routes the message to the right staff member fast. The physician still makes any clinical decision, and anything a patient reports that sounds urgent routes to staff immediately."}}]}</script>
