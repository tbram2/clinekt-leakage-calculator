<script type="application/ld+json">{"@context": "https://schema.org", "@type": "FAQPage", "mainEntity": [{"@type": "Question", "name": "Is Clinekt patient engagement software for behavioral health practices?", "acceptedAnswer": {"@type": "Answer", "text": "Yes. Clinekt holds one record for every client, prospective, active, and lapsed, and the Inbound, Recall, Outbound, and Care agents work from that shared memory to answer inquiries, manage recall intervals, reactivate lapsed clients, and run between-visit check-ins."}}, {"@type": "Question", "name": "What is the difference between patient engagement software and a recall or reactivation tool?", "acceptedAnswer": {"@type": "Answer", "text": "Recall and reactivation are specific jobs: watching an interval so it does not lapse, or recovering a client whose care already stopped. Engagement software is the category that carries both jobs, plus pre-visit inquiries and between-visit check-ins, on one record instead of handing a client between separate tools."}}, {"@type": "Question", "name": "Can engagement software interpret a PHQ-9, GAD-7, or other measure?", "acceptedAnswer": {"@type": "Answer", "text": "No. It can send the measurement link, collect the response, and flag a concerning answer to a clinician the same day. Interpreting the score and deciding what it means for treatment stays with the clinician."}}, {"@type": "Question", "name": "Is engagement outreach to behavioral health clients allowed under HIPAA and 42 CFR Part 2?", "acceptedAnswer": {"@type": "Answer", "text": "Contacting your own clients about their own care is a treatment communication and is generally permitted under HIPAA when it honors the client's stated contact preferences and keeps message content minimal. Clients covered by a 42 CFR Part 2 substance use disorder program need a valid consent on file before any outreach."}}, {"@type": "Question", "name": "How do we measure whether patient engagement software is working?", "acceptedAnswer": {"@type": "Answer", "text": "Track found, reached, booked, and seen across every job, pre-visit inquiries, recall, and reactivation, each month. Rising kept visits and falling lapsed-client counts mean engagement is working. Rising message volume alone means the practice bought a messaging tool."}}]}</script>
