        {"@type": "Question", "name": "Why does my reminder system say a text was sent when the patient never received it?", "acceptedAnswer": {"@type": "Answer", "text": "Sent usually means the message left your software and was handed to a carrier, not that the carrier delivered it to the patient's phone. Most reminder tools do not display the difference, so a message can be silently filtered by the carrier network and still show as sent in your dashboard."}},
        {"@type": "Question", "name": "What is A2P 10DLC and how does it affect appointment reminders?", "acceptedAnswer": {"@type": "Answer", "text": "A2P 10DLC is the registration system US carriers use to vet businesses texting from regular 10-digit phone numbers. An unregistered number gets its texts blocked outright, and even a registered number can have individual messages filtered if the content or sending pattern looks spam-like."}},
