        {"@type": "Question", "name": "What is orthopedic patient intake software?", "acceptedAnswer": {"@type": "Answer", "text": "Software that collects a new or returning patient's history, injury details, insurance, and consent before the visit, with orthopedic-specific fields for mechanism of injury, referring physician and imaging, workers' comp claim details, and subspecialty routing that a general medical intake form does not ask for."}},
