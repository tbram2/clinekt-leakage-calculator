<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is orthopedic patient leakage?","acceptedAnswer":{"@type":"Answer","text":"The gap between the referrals, calls, and recall-eligible patients an orthopedic practice generates and the number who actually end up booked and seen. It concentrates at three points: unanswered calls, referrals routed to the wrong subspecialist, and post-op or dormant patients who go quiet."}},{"@type":"Question","name":"How much orthopedic referral volume is typically lost to leakage?","acceptedAnswer":{"@type":"Answer","text":"It varies by failure point. A four-year, 23,435-referral study found roughly 88% of referrals into orthopedic clinics were either unnecessary or ambiguous as primary orthopedic cases, meaning a large share of scheduled capacity was consumed by misrouted rather than correctly routed patients."}},{"@type":"Question","name":"Do no-show rates differ by orthopedic subspecialty?","acceptedAnswer":{"@type":"Answer","text":"Yes. A 2018 study of one orthopedic institution's full calendar-year schedule found an overall 11.5% no-show rate with significant differences by subspecialty, age, and race, but no significant difference by time of day or month, meaning subspecialty is a better predictor than scheduling slot."}},{"@type":"Question","name":"What is the difference between patient leakage and referral leakage?","acceptedAnswer":{"@type":"Answer","text":"Referral leakage is the specific case of a referral that never converts into a completed visit. Patient leakage is the broader category, covering referral leakage plus missed calls from new or returning patients and dormant patients who never get recalled, whether or not a referral was ever involved."}},{"@type":"Question","name":"How do I measure whether patient leakage is improving?","acceptedAnswer":{"@type":"Answer","text":"Track completion rate by referral source and by subspecialty, not raw call or lead volume. A rising completion rate on the same or growing referral volume is the signal that routing, follow-through, and recall are actually working, not just busier."}}]}</script>
