# Free/busy feed for the Book a Demo picker on clinekthealth.com. See tools/availability/make_busy.py.
# Reads the published Outlook calendar (secret CALENDAR_ICS_URL, availability only) and writes busy.json to the
# `availability` branch, which holds that one file in one commit (force-pushed, so master's history stays clean).
name: availability
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: availability
  cancel-in-progress: true
jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/availability
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet icalendar recurring-ical-events
      - name: Build busy.json
        env:
          CALENDAR_ICS_URL: ${{ secrets.CALENDAR_ICS_URL }}
        run: python tools/availability/make_busy.py feed/busy.json
      - name: Publish to the availability branch
        run: |
          cd feed
          git init -q -b availability
          git config user.name "clinekt-availability"
          git config user.email "actions@users.noreply.github.com"
          git add busy.json
          git commit -q -m "busy.json"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" availability
